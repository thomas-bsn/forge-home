services:
  homepage:
    build: .
    container_name: homepage
    ports:
      - "3000:3000"
    volumes:
      - homepage-data:/data
    restart: unless-stopped
    # To check apps by container name (e.g. http://jellyfin:8096),
    # join the Docker network they are on:
    # networks:
    #   - default
    #   - my-network

volumes:
  homepage-data:

