services:
  homepage:
    build: .
    container_name: homepage
    ports:
      - "3000:3000"
    volumes:
      - homepage-data:/data
    restart: unless-stopped
    # Server-specific settings (port, networks…) go in docker-compose.override.yml,
    # not here: see docker-compose.override.example.yml.

volumes:
  homepage-data:
